{% extends "library/base.html" %}

{% block title %}Delete Book | Rory's Library{% endblock %}

{% block content %}

    <h2>Delete Book</h2>

    <p>Are you sure you want to delete "{{ book.title }}"?</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete Book</button>
    </form>

    <p>
        <a href="{% url 'home' %}">Cancel and Return Home</a>
    </p>

{% endblock %}
