<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rory's Library{% endblock %}</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:960px;margin:30px auto;padding:0 18px;line-height:1.6;color:#1f2937}a{color:#155e75}nav a{margin-right:16px}.button,button{background:#155e75;color:white;border:0;border-radius:5px;padding:8px 14px;cursor:pointer}input,select,textarea{max-width:100%;padding:7px;margin:4px 0}section{padding:12px 0}.pagination a{margin-right:12px}.message{padding:10px;background:#e0f2fe;margin:8px 0}
</style>
</head>
<body>

    <header>
        <h1>Rory's Library</h1>
        <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'add_book' %}">Add Book</a>
        <a href="{% url 'book-list' %}">Catalogue</a>
        </nav>
        <hr>
    </header>

    <main>
        {% if messages %}{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% endif %}
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Rory's Library</p>
    </footer>

</body>
</html>
